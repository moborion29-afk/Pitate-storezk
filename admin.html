<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro do Capitão</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#050505;
padding:20px;
}

.livro{

max-width:700px;
margin:auto;
background:linear-gradient(135deg,#3b2208,#1b1208);
border:4px solid #7a4b17;
border-radius:20px;
padding:25px;
box-shadow:0 0 30px rgba(0,0,0,.6);

}

h1{

text-align:center;
color:#ffd67a;
margin-bottom:25px;

}

.conta{

background:rgba(0,0,0,.25);
padding:18px;
border-radius:15px;
margin-bottom:18px;
border:1px solid rgba(255,255,255,.08);

}

.status{

display:inline-block;
padding:6px 12px;
border-radius:20px;
background:#00aa44;
margin-bottom:12px;

}

.botoes{

display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;

}

button{

padding:12px 18px;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;

}

.editar{

background:#0a6cff;

}

.vendida{

background:#d10000;

}

.nova{

width:100%;
margin-top:20px;
background:#ff2d2d;
padding:16px;
font-size:18px;

}

</style>

</head>

<body>

<div class="livro">

<h1>📖 Livro do Capitão</h1>

<div class="conta">

<div class="status">Disponível</div>

<h2>Conta Lv.2600</h2>

<p>Preço: R$149,90</p>

<p>Ghoul V4 • Kitsune • Leopard</p>

<div class="botoes">

<button class="editar">
✏️ Editar
</button>

<button class="vendida">
🏴 Marcar Vendida
</button>

</div>

</div>

<button class="nova">
➕ Nova Conta
</button>

</div>

</body>
</html>
