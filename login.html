<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar como ADM - Pirate Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
}

.bg{
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.9)),
url("assets/luffy-bg.webp");
background-size:cover;
background-position:center;
filter:brightness(.55);
}

.card{
position:relative;
z-index:2;
width:90%;
max-width:360px;
padding:28px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(10px);
border:1px solid rgba(255,0,0,.35);
border-radius:22px;
text-align:center;
}

.cofre{
font-size:70px;
margin-bottom:10px;
animation:balanco 2s infinite;
}

@keyframes balanco{
50%{transform:rotate(4deg);}
}

.logo{
font-size:32px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 18px red;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
background:#111;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:12px;
background:#d10000;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff2d2d;
}

.erro{
display:none;
margin-top:12px;
color:#ff6666;
}
</style>

</head>
<body>

<div class="bg"></div>

<div class="card">

<div class="cofre" id="cofre">☠️</div>

<div class="logo">PIRATE STORE</div>

<p>Área exclusiva do Capitão</p>

<input id="user" placeholder="Usuário">

<input id="pass" type="password" placeholder="Senha">

<button onclick="login()">
Abrir Cofre
</button>

<div id="erro" class="erro">
Usuário ou senha incorretos.
</div>

</div>

<script>

function login(){

const usuario=document.getElementById("user").value.trim();
const senha=document.getElementById("pass").value;

if(usuario==="admpirate2026" && senha==="15022013"){

sessionStorage.setItem("adminLogado","sim");

document.getElementById("cofre").innerHTML="🔓";

setTimeout(()=>{
window.location.href="admin.html";
},800);

}else{

document.getElementById("erro").style.display="block";

}

}

</script>

</body>
</html>
