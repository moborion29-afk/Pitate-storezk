<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas - Pirate Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
}

header{
position:sticky;
top:0;
background:#0b0b0b;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #b30000;
}

.logo{
font-size:30px;
font-weight:bold;
color:#ff2d2d;
}

.voltar{
text-decoration:none;
color:white;
padding:10px 16px;
border:1px solid #ff2d2d;
border-radius:10px;
}

.titulo{
text-align:center;
font-size:34px;
margin:30px 0;
color:#ff2d2d;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:22px;
padding:20px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
border:1px solid #222;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(255,0,0,.35);
}

.banner{
height:220px;
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
background:
linear-gradient(135deg,#350000,#8a0000);
}

.info{
padding:20px;
}

.status{
display:inline-block;
background:#00aa44;
padding:6px 12px;
border-radius:20px;
font-size:13px;
margin-bottom:12px;
}

.price{
font-size:30px;
font-weight:bold;
color:#ff2d2d;
margin:12px 0;
}

.buy{
display:block;
text-align:center;
padding:15px;
background:#d10000;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:bold;
}

footer{
padding:25px;
text-align:center;
color:#888;
}
</style>

</head>

<body>

<header>

<div class="logo">PIRATE STORE</div>

<a class="voltar" href="index.html">
← Voltar
</a>

</header>

<h1 class="titulo">
Contas Disponíveis
</h1>

<div class="grid">

<div class="card">

<div class="banner">
🏴‍☠️
</div>

<div class="info">

<div class="status">
Disponível
</div>

<h2>Conta Lv.2600</h2>

<p>Ghoul V4 • Kitsune • Leopard</p>

<div class="price">
R$149,90
</div>

<a class="buy"
href="https://wa.me/555198379743?text=Quero comprar a Conta Lv.2600.">
Comprar
</a>

</div>

</div>

</div>

<footer>
Pirate Store • Banco Inter • Blox Fruits
</footer>

</body>
</html>
