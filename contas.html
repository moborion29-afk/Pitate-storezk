<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas - Pirate Store</title>

<link rel="stylesheet" href="css/style.css">

<style>

header{
position:sticky;
top:0;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0b0b;
border-bottom:2px solid #b30000;
z-index:100;
}

.logo-top{
font-size:28px;
font-weight:bold;
color:#ff2d2d;
}

.back{
text-decoration:none;
color:white;
padding:10px 16px;
border:1px solid #ff2d2d;
border-radius:10px;
}

.titulo{
text-align:center;
font-size:34px;
margin:35px 0;
color:#ff2d2d;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
padding:20px;
}

.wanted{
background:#141414;
border-radius:22px;
overflow:hidden;
border:2px solid #6b2b00;
transition:.35s;
animation:balanco 4s ease-in-out infinite;
}

.wanted:hover{
transform:translateY(-8px);
box-shadow:0 0 30px rgba(255,0,0,.35);
}

@keyframes balanco{

0%{transform:rotate(-1deg);}
50%{transform:rotate(1deg);}
100%{transform:rotate(-1deg);}

}

.poster{

height:230px;
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
background:
linear-gradient(135deg,#4a2c0a,#8b5a2b);

}

.info{

padding:22px;

}

.rarity{

display:inline-block;
padding:6px 12px;
border-radius:20px;
background:#00aa44;
font-size:13px;
margin-bottom:12px;

}

.price{

font-size:30px;
font-weight:bold;
color:#ff2d2d;
margin:12px 0;

}

.buy{

display:block;
text-align:center;
padding:15px;
background:#d10000;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:bold;

}

.buy:hover{

background:#ff2d2d;

}

</style>

</head>

<body>

<header>

<div class="logo-top">
PIRATE STORE
</div>

<a class="back" href="index.html">
← Voltar
</a>

</header>

<h1 class="titulo">
⚓ Contas Disponíveis
</h1>

<div class="grid">

<div class="wanted">

<div class="poster">
🏴‍☠️
</div>

<div class="info">

<div class="rarity">
Imperador
</div>

<h2>Conta Lv.2600</h2>

<p>
Ghoul V4 • Kitsune • Leopard
</p>

<div class="price">
R$149,90
</div>

<a class="buy"
href="produto.html">
Ver Recompensa
</a>

</div>

</div>

</div>

</body>
</html>
