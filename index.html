<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pirate Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#050505;color:#fff;overflow-x:hidden;}
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
position:relative;
overflow:hidden;
}
.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.45);
}
.overlay{
position:absolute;
inset:0;
background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.85));
}
.lightning{
position:absolute;
inset:0;
background:radial-gradient(circle,#ff000022,transparent 60%);
animation:pulse 2s infinite;
}
@keyframes pulse{
50%{opacity:.3;}
}
.box{
position:relative;
z-index:2;
max-width:380px;
width:100%;
padding:25px;
border-radius:25px;
background:rgba(0,0,0,.45);
backdrop-filter:blur(8px);
border:1px solid rgba(255,0,0,.4);
text-align:center;
}
.logo{
font-size:46px;
font-weight:bold;
color:#ff2020;
text-shadow:0 0 20px red;
margin-bottom:10px;
}
p{
font-size:22px;
line-height:1.5;
margin-bottom:30px;
}
.btn{
display:block;
padding:16px;
margin:12px 0;
border-radius:12px;
text-decoration:none;
font-size:22px;
font-weight:bold;
transition:.25s;
}
.whats{
background:#d90000;
color:white;
}
.whats:hover{
transform:scale(1.03);
}
.out{
border:2px solid #ff2020;
color:white;
}
.out:hover{
background:#ff2020;
}
#contas{
padding:40px 20px;
background:#080808;
}
.card{
background:#111;
border-radius:20px;
overflow:hidden;
max-width:350px;
margin:auto;
border:1px solid #222;
}
.card img{
width:100%;
display:block;
}
.info{
padding:20px;
}
.price{
color:#ff2020;
font-size:32px;
font-weight:bold;
margin:10px 0;
}
.buy{
display:block;
text-align:center;
padding:14px;
background:#d90000;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}
footer{
padding:20px;
text-align:center;
color:#aaa;
background:#050505;
}
</style>
</head>

<body>

<section class="hero">

<img src="https://i.imgur.com/W1YQq9N.jpeg">

<div class="overlay"></div>
<div class="lightning"></div>

<div class="box">

<div class="logo">PIRATE STORE</div>

<p>
Obrigado por participar da nossa jornada no rumo de venda de contas.
</p>

<a class="btn whats"
href="https://wa.me/555198379743?text=Olá!%20Tenho%20interesse%20em%20uma%20conta%20da%20Pirate%20Store.">
🏴‍☠️ Fale Conosco
</a>

<a class="btn out" href="#contas">
⚓ Ver Contas
</a>

</div>

</section>

<section id="contas">

<div class="card">

<img src="https://i.imgur.com/W1YQq9N.jpeg">

<div class="info">

<h2>Conta Lv.2600</h2>

<p style="font-size:17px;color:#ccc;margin-bottom:10px;">
Ghoul V4 • Kitsune • Leopard
</p>

<div class="price">R$149,90</div>

<a class="buy"
href="https://wa.me/555198379743?text=Quero%20comprar%20a%20Conta%20Lv.2600.">
Comprar
</a>

</div>

</div>

</section>

<footer>

Pirate Store • Blox Fruits • Banco Inter

</footer>

</body>
</html>
