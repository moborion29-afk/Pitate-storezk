<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirate Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
overflow:hidden;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.9)),
radial-gradient(circle at top,#4d0000,#050505 70%);
}

.hero::before{
content:"";
position:absolute;
width:150%;
height:150%;
background:
radial-gradient(circle,rgba(255,0,0,.12),transparent 60%);
animation:pulse 3s infinite;
}

@keyframes pulse{
50%{transform:scale(1.1);opacity:.4;}
}

.box{
position:relative;
z-index:2;
width:92%;
max-width:400px;
padding:30px;
border-radius:22px;
background:rgba(0,0,0,.45);
backdrop-filter:blur(8px);
border:1px solid rgba(255,0,0,.35);
text-align:center;
}

.logo{
font-size:46px;
font-weight:bold;
color:#ff1f1f;
text-shadow:0 0 20px red;
margin-bottom:15px;
}

.texto{
font-size:20px;
line-height:1.5;
margin-bottom:28px;
}

.btn{
display:block;
padding:16px;
margin:12px 0;
border-radius:14px;
text-decoration:none;
font-size:20px;
font-weight:bold;
transition:.25s;
}

.whats{
background:#d10000;
color:white;
}

.out{
border:2px solid #ff2d2d;
color:white;
}

.out:hover{
background:#ff2d2d;
}

footer{
padding:20px;
text-align:center;
color:#888;
}
</style>

</head>

<body>

<section class="hero">

<div class="box">

<div class="logo">PIRATE STORE</div>

<div class="texto">
Obrigado por participar da nossa jornada no rumo de venda de contas.
</div>

<a class="btn whats"
href="https://wa.me/555198379743?text=Olá! Tenho interesse em uma conta da Pirate Store.">
🏴‍☠️ Fale Conosco
</a>

<a class="btn out" href="contas.html">
⚓ Ver Contas
</a>

</div>

</section>

<footer>
Pirate Store • Banco Inter • Blox Fruits
</footer>

</body>
</html>
