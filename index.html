<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pirate Store</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
background:#050505;
font-family:Arial,sans-serif;
overflow:hidden;
color:white;
}

/* INTRO */

#intro{
position:fixed;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
transition:opacity .8s;
}

#intro.hide{
opacity:0;
pointer-events:none;
}

.jolly{
font-size:90px;
animation:girar 2s ease;
}

@keyframes girar{
0%{
transform:scale(.5) rotate(-180deg);
opacity:0;
}
100%{
transform:scale(1) rotate(0);
opacity:1;
}
}

.intro-text{
margin-top:18px;
font-size:30px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 20px red;
}

/* MENU */

.menu{

position:fixed;
left:-280px;
top:0;
width:260px;
height:100%;
background:#0b0b0b;
padding:25px;
display:flex;
flex-direction:column;
gap:18px;
transition:.35s;
z-index:6000;
border-right:2px solid #7a0000;

}

.menu.show{
left:0;
}

.menu-header{
display:flex;
justify-content:space-between;
align-items:center;
font-size:22px;
font-weight:bold;
color:#ff2d2d;
margin-bottom:20px;
}

.menu a{
text-decoration:none;
color:white;
padding:12px;
border-radius:10px;
}

.menu a:hover{
background:#d10000;
}

.menu-btn{

position:fixed;
top:15px;
left:15px;
width:50px;
height:50px;
border:none;
border-radius:12px;
background:#d10000;
color:white;
font-size:24px;
z-index:7000;
cursor:pointer;

}

.menu-header button{
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}

/* TOPO */

.topbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.35);
backdrop-filter:blur(8px);
z-index:5000;
}

.topbar span{
color:#ff2d2d;
font-weight:bold;
letter-spacing:2px;
}

/* HERO */

.hero{
position:relative;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.bg{
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.88)),
url("assets/luffy-bg.webp");
background-size:cover;
background-position:center;
filter:brightness(.55);
}

/* RELÂMPAGO */

.flash{
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,0,0,.25),transparent 35%),
radial-gradient(circle at 80% 35%,rgba(255,0,0,.18),transparent 30%);
animation:raio 2.5s infinite;
}

@keyframes raio{
50%{opacity:.35;}
}

/* CHUVA */

.rain{
position:absolute;
inset:0;
pointer-events:none;
overflow:hidden;
}

.drop{
position:absolute;
top:-20px;
width:2px;
height:18px;
background:rgba(255,70,70,.8);
animation:rain linear infinite;
}

@keyframes rain{
100%{transform:translateY(110vh);}
}

/* BRASAS */

.embers{
position:absolute;
inset:0;
overflow:hidden;
}

.embers span{
position:absolute;
bottom:-20px;
width:6px;
height:6px;
background:#ff4d00;
border-radius:50%;
animation:subir linear infinite;
}

@keyframes subir{
100%{
transform:translateY(-110vh);
opacity:0;
}
}

/* CARD */

.box{
position:relative;
z-index:5;
width:90%;
max-width:390px;
padding:30px;
background:rgba(0,0,0,.42);
backdrop-filter:blur(10px);
border-radius:24px;
border:1px solid rgba(255,0,0,.35);
text-align:center;
}

.logo{
font-size:44px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 20px red;
animation:acender 2s infinite alternate;
}

@keyframes acender{
from{text-shadow:0 0 10px #700;}
to{text-shadow:0 0 30px red;}
}

.box p{
font-size:18px;
line-height:1.6;
margin:22px 0;
color:#ddd;
}

.btn{
display:block;
padding:16px;
margin:12px 0;
border-radius:14px;
text-decoration:none;
font-size:18px;
font-weight:bold;
color:white;
transition:.3s;
}

.red{
background:#d10000;
}

.red:hover{
transform:scale(1.03);
}

.out{
border:2px solid #ff2d2d;
}

.out:hover{
background:#ff2d2d;
}

.contador{
margin-top:18px;
color:#ffaaaa;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{opacity:.5;}
}

/* BÚSSOLA */

.compass{
position:fixed;
bottom:18px;
left:18px;
font-size:34px;
cursor:pointer;
z-index:100;
transition:.3s;
}

.compass:hover{
transform:rotate(25deg);
}

</style>

</head>

<body>

<!-- INTRO -->

<div id="intro">

<div class="jolly">☠️</div>

<div class="intro-text">PIRATE STORE</div>

</div>

<!-- MENU -->

<div id="menu" class="menu">

<div class="menu-header">

🏴 Pirate Store

<button id="closeMenu">✖</button>

</div>

<a href="index.html">⚓ Início</a>

<a href="contas.html">📜 Ver Contas</a>

<a href="login.html">🔐 Entrar como ADM</a>

<a href="ilha.html">🏝️ Ilha dos Imperadores</a>

<a href="https://wa.me/555198379743?text=Olá! Preciso de ajuda na Pirate Store.">

💬 Fale Conosco

</a>

</div>

<button id="openMenu" class="menu-btn">☰</button>

<!-- TOPO -->

<div class="topbar">

<span>PIRATE STORE • ⚓ 3 Tesouros</span>

</div>

<!-- HERO -->

<section class="hero">

<div class="bg"></div>

<div class="flash"></div>

<div class="rain" id="rain"></div>

<div class="embers" id="embers"></div>

<div class="box">

<div class="logo">
PIRATE STORE
</div>

<p>

Obrigado por participar da nossa jornada no rumo da venda de contas.

</p>

<a class="btn red"
href="https://wa.me/555198379743?text=Olá! Tenho interesse em uma conta da Pirate Store.">

🏴‍☠️ Fale Conosco

</a>

<a class="btn out"
href="contas.html">

⚓ Ver Contas

</a>

<div class="contador">

⚓ 3 Tesouros aguardando um novo capitão.

</div>

</div>

</section>

<!-- BÚSSOLA -->

<div id="compass" class="compass">

🧭

</div>

<script>

/* INTRO */

setTimeout(()=>{

document.getElementById("intro").classList.add("hide");

},2200);

/* BRASAS */

const embers=document.getElementById("embers");

for(let i=0;i<35;i++){

const e=document.createElement("span");

e.style.left=Math.random()*100+"%";

e.style.animationDuration=(3+Math.random()*4)+"s";

e.style.animationDelay=Math.random()*4+"s";

embers.appendChild(e);

}

/* CHUVA */

const rain=document.getElementById("rain");

for(let i=0;i<90;i++){

const d=document.createElement("span");

d.className="drop";

d.style.left=Math.random()*100+"%";

d.style.animationDuration=(.8+Math.random()*.7)+"s";

d.style.animationDelay=Math.random()*2+"s";

rain.appendChild(d);

}

/* MENU */

const menu=document.getElementById("menu");

document.getElementById("openMenu").onclick=()=>menu.classList.add("show");

document.getElementById("closeMenu").onclick=()=>menu.classList.remove("show");

/* BÚSSOLA */

let clicks=0;

document.getElementById("compass").onclick=()=>{

clicks++;

if(clicks>=5){

window.location.href="ilha.html";

}

};

</script>

</body>
</html>
